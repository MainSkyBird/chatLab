services:
    mysql:
        image: mysql:8.4
        container_name: chatlab-mysql
        restart: always
        environment:
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
            MYSQL_DATABASE: ${DB_DATABASE}
            MYSQL_USER: ${DB_USERNAME}
            MYSQL_PASSWORD: ${DB_PASSWORD}
        ports:
            - "127.0.0.1:3306:3306"
        volumes:
            - mysql-data:/var/lib/mysql

volumes:
    mysql-data:

